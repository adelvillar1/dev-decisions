<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#db2777"/>
    </marker>
  </defs>

  <rect width="1240" height="900" fill="#f8fafc"/>

  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">dev-decisions — architecture</text>
  <text x="40" y="78" font-size="14" fill="#475569">Decision-model gates for git + ZCode workflows · every decision logged to JSONL for calibration</text>

  <!-- ── entry points row ─────────────────────────────────────────────── -->
  <!-- git hooks card -->
  <rect x="40" y="100" width="360" height="110" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="60" cy="128" r="5" fill="#2563eb"/>
  <text x="74" y="133" font-size="16" font-weight="700" fill="#0f172a">git hooks</text>
  <text x="60" y="162" font-size="13" fill="#334155">pre-commit → scan-staged (secrets)</text>
  <text x="60" y="182" font-size="13" fill="#334155">pre-push → classify-diff (tasks)</text>
  <text x="60" y="200" font-size="10.5" fill="#94a3b8" letter-spacing="1">AUTOMATIC · PER-REPO</text>

  <!-- zcode card -->
  <rect x="440" y="100" width="360" height="110" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="460" cy="128" r="5" fill="#7c3aed"/>
  <text x="474" y="133" font-size="16" font-weight="700" fill="#0f172a">ZCode PreToolUse hook</text>
  <text x="460" y="162" font-size="13" fill="#334155">zcode-gate on every Bash command</text>
  <text x="460" y="182" font-size="13" fill="#334155">inert-stripped patterns + safety task · HITL block</text>
  <text x="460" y="200" font-size="10.5" fill="#94a3b8" letter-spacing="1">AUTOMATIC · GLOBAL · OPT-IN</text>

  <!-- cli card -->
  <rect x="840" y="100" width="360" height="110" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="860" cy="128" r="5" fill="#0d9488"/>
  <text x="874" y="133" font-size="16" font-weight="700" fill="#0f172a">CLI + ZCode skill</text>
  <text x="860" y="160" font-size="12" fill="#334155">plan-gate · evidence-gate · docs-gate</text>
  <text x="860" y="177" font-size="12" fill="#334155">arch-gate · ux-surface · uc-gate · plan-reconcile</text>
  <text x="860" y="194" font-size="12" fill="#334155">calibration · disposition · pr-gate · triage-issues</text>
  <text x="860" y="200" font-size="10.5" fill="#94a3b8" letter-spacing="1">ON DEMAND</text>

  <line x1="220" y1="210" x2="220" y2="256" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="620" y1="210" x2="620" y2="256" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="1020" y1="210" x2="1020" y2="256" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── decision engine ──────────────────────────────────────────────── -->
  <rect x="40" y="260" width="1160" height="310" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="64" y="294" font-size="17" font-weight="700" fill="#0f172a">decision engine</text>

  <!-- col 1: task registry -->
  <text x="64" y="326" font-size="14" font-weight="700" fill="#2563eb">① task registry</text>
  <g font-size="12" fill="#1e40af">
    <rect x="64"  y="340" width="86" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="107" y="357" text-anchor="middle">change</text>
    <rect x="158" y="340" width="86" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="201" y="357" text-anchor="middle">commit_audit</text>
    <rect x="252" y="340" width="86" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="295" y="357" text-anchor="middle">deps_risk</text>
    <rect x="346" y="340" width="86" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="389" y="357" text-anchor="middle">docs_drift</text>
    <rect x="64"  y="374" width="86" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="107" y="391" text-anchor="middle">api_drift</text>
    <rect x="158" y="374" width="86" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="201" y="391" text-anchor="middle">pr_gate</text>
    <rect x="252" y="374" width="86" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="295" y="391" text-anchor="middle">issue_triage</text>
    <rect x="346" y="374" width="86" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="389" y="391" text-anchor="middle">safety</text>
    <rect x="64"  y="408" width="86" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="107" y="425" text-anchor="middle" font-size="11">plan_gate</text>
    <rect x="158" y="408" width="86" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="201" y="425" text-anchor="middle" font-size="11">evidence_gate</text>
    <rect x="252" y="408" width="86" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="295" y="425" text-anchor="middle" font-size="11">docs_gate</text>
    <rect x="346" y="408" width="86" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="389" y="425" text-anchor="middle" font-size="11">arch_gate</text>
  </g>
  <text x="64" y="466" font-size="12" fill="#64748b">every feature = heads per provider</text>
  <text x="64" y="484" font-size="12" fill="#64748b">auto-detect from changed paths · --task to override</text>
  <text x="64" y="502" font-size="12" fill="#64748b">new task = define heads, no provider code</text>

  <!-- col 2: guards -->
  <text x="490" y="326" font-size="14" font-weight="700" fill="#dc2626">② guards</text>
  <text x="490" y="356" font-size="13" fill="#334155">secret hit → skip vendor entirely</text>
  <text x="490" y="380" font-size="13" fill="#334155">sensitive repo → deny vendor</text>
  <text x="504" y="398" font-size="12" fill="#64748b">unless --allow-vendor</text>
  <text x="490" y="422" font-size="13" fill="#334155">PII → warn, never block</text>
  <text x="490" y="446" font-size="13" fill="#334155">max 12k chars per diff</text>
  <text x="490" y="470" font-size="12" fill="#64748b">credentials via env vars only</text>

  <!-- col 3: provider routing — auto → sys1 -->
  <text x="800" y="326" font-size="14" font-weight="700" fill="#059669">③ provider routing — auto → sys1 roster</text>
  <g font-size="12">
    <rect x="800" y="338" width="376" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="816" y="354" fill="#065f46" font-weight="600">glide</text>
    <text x="866" y="354" fill="#64748b">default head · size gate routes long inputs to drex</text>
    <rect x="800" y="366" width="376" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="816" y="382" fill="#065f46" font-weight="600">drex</text>
    <text x="860" y="382" fill="#64748b">131k context · long states</text>
    <rect x="800" y="394" width="376" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="816" y="410" fill="#065f46" font-weight="600">jev</text>
    <text x="852" y="410" fill="#64748b">choice / score / noul · fan-out native</text>
    <rect x="800" y="422" width="376" height="24" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="816" y="438" fill="#475569" font-weight="600">decide</text>
    <text x="872" y="438" fill="#64748b">chat-wire fallback · declines on ambiguity</text>
    <rect x="800" y="450" width="376" height="24" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="816" y="466" fill="#475569" font-weight="600">local venv (GLiNER)</text>
    <text x="940" y="466" fill="#64748b">optional · offline · not in use</text>
    <rect x="800" y="478" width="376" height="24" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="816" y="494" fill="#475569" font-weight="600">modernbert</text>
    <text x="898" y="494" fill="#64748b">eval only — calibration comparison</text>
    <rect x="800" y="506" width="376" height="24" rx="12" fill="#fffbeb" stroke="#fde68a"/>
    <text x="816" y="522" fill="#b45309" font-weight="600">julia</text>
    <text x="862" y="522" fill="#64748b">calibrated OUT (1/6 agreement) · bulk triage only</text>
    <rect x="800" y="534" width="376" height="24" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="816" y="550" fill="#475569">candidates opt-in: clm · openjev · kev · tev1 · laya …</text>
  </g>
  <text x="800" y="552" font-size="11.5" fill="#64748b">roster: glide,drex,jev · size gate · by_task overrides · candidates opt-in</text>

  <!-- arrows engine → bottom row -->
  <line x1="320" y1="570" x2="320" y2="616" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="920" y1="570" x2="920" y2="616" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── bottom row ───────────────────────────────────────────────────── -->
  <!-- jsonl log -->
  <rect x="40" y="620" width="560" height="150" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="60" cy="648" r="5" fill="#db2777"/>
  <text x="74" y="653" font-size="16" font-weight="700" fill="#0f172a">JSONL decision log</text>
  <text x="60" y="684" font-size="13" fill="#334155">~/.local/share/dev-decisions/logs/YYYY/MM/DD.jsonl</text>
  <text x="60" y="708" font-size="12" fill="#64748b">op · task · provider · confidence · verdict · latency</text>
  <text x="60" y="728" font-size="12" fill="#64748b">one line per decision — the calibration dataset</text>
  <text x="60" y="752" font-size="10.5" fill="#94a3b8" letter-spacing="1">ALWAYS APPENDED · NEVER BLOCKS ON FAILURE</text>

  <!-- calibration loop -->
  <rect x="640" y="620" width="560" height="150" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="660" cy="648" r="5" fill="#059669"/>
  <text x="674" y="653" font-size="16" font-weight="700" fill="#0f172a">calibration loop</text>
  <text x="660" y="684" font-size="13" fill="#334155">dispositions pair with events → feedback rows</text>
  <text x="660" y="708" font-size="13" fill="#334155">calibration cmd: per-head counts · trend · fit</text>
  <text x="660" y="732" font-size="13" fill="#334155">floors fit only when a head qualifies (≥20, span)</text>
  <text x="660" y="752" font-size="10.5" fill="#94a3b8" letter-spacing="1">THRESHOLDS DON'T TRANSFER — FIT LOCALLY</text>

  <!-- feedback arrow -->
  <path d="M 1200 695 L 1224 695 L 1224 415 L 1204 415" fill="none" stroke="#db2777" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrPink)"/>
  <text transform="rotate(-90 1233 555)" x="1233" y="555" text-anchor="middle" font-size="11" fill="#db2777">confidence floors feed back</text>

  <!-- exit codes legend -->
  <g font-size="13" font-weight="700">
    <rect x="40"  y="816" width="130" height="34" rx="17" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="105" y="838" text-anchor="middle" fill="#047857">0 · pass</text>
    <rect x="190" y="816" width="130" height="34" rx="17" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="255" y="838" text-anchor="middle" fill="#b45309">1 · warn</text>
    <rect x="340" y="816" width="130" height="34" rx="17" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="405" y="838" text-anchor="middle" fill="#b91c1c">2 · block</text>
    <rect x="490" y="816" width="130" height="34" rx="17" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="555" y="838" text-anchor="middle" fill="#475569">3 · error</text>
  </g>
  <text x="650" y="838" font-size="12" fill="#94a3b8">exit codes follow the git hook convention: 0 = proceed, non-zero = stop</text>
</svg>
