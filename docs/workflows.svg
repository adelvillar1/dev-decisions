<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1060" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1240" height="1060" fill="#f8fafc"/>

  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">workflows — the gate family</text>
  <text x="40" y="78" font-size="14" fill="#475569">classify &amp; scan · contract gates · surfaces &amp; reconcile · zcode-gate + calibration — all advisory by default, every run appended to the JSONL log</text>

  <!-- ── row 1: classify & scan (v0.2 workflows) ──────────────────────── -->
  <text x="40" y="112" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="1">CLASSIFY &amp; SCAN</text>

  <rect x="40" y="122" width="282" height="150" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="62" cy="148" r="5" fill="#2563eb"/>
  <text x="76" y="153" font-size="15" font-weight="700" fill="#0f172a">classify-diff</text>
  <text x="60" y="178" font-size="12" fill="#334155">secret scan → task registry → routing</text>
  <text x="60" y="196" font-size="12" fill="#334155">→ confidence gate → labels</text>
  <text x="60" y="222" font-size="12" fill="#64748b">path-based task detection · docs pushdown</text>
  <text x="60" y="248" font-size="10.5" fill="#94a3b8" letter-spacing="1">FEEDBACK ROWS VIA --head-id</text>

  <rect x="346" y="122" width="282" height="150" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="368" cy="148" r="5" fill="#7c3aed"/>
  <text x="382" y="153" font-size="15" font-weight="700" fill="#0f172a">pr-gate --fanout</text>
  <text x="366" y="178" font-size="12" fill="#334155">per-file risky/action heads in ONE request</text>
  <text x="366" y="196" font-size="12" fill="#334155">routes through sys1 by default</text>
  <text x="366" y="222" font-size="12" fill="#64748b">--diff-file for offline diffs</text>
  <text x="366" y="248" font-size="10.5" fill="#94a3b8" letter-spacing="1">LABELS APPLIED · DRY-RUN FIRST</text>

  <rect x="652" y="122" width="282" height="150" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="674" cy="148" r="5" fill="#0d9488"/>
  <text x="688" y="153" font-size="15" font-weight="700" fill="#0f172a">triage-issues · changelog</text>
  <text x="672" y="178" font-size="12" fill="#334155">gh issues batch-classified, dry-run default</text>
  <text x="672" y="196" font-size="12" fill="#334155">keep-a-changelog from classified commits</text>
  <text x="672" y="222" font-size="12" fill="#64748b">fleet-scan across ~/Projects</text>
  <text x="672" y="248" font-size="10.5" fill="#94a3b8" letter-spacing="1">UNCLASSIFIED → CHANGED</text>

  <!-- ── row 2: contract gates ────────────────────────────────────────── -->
  <text x="40" y="312" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="1">CONTRACT GATES — ADVISORIAL · NEGATIVES NEED DISPOSITIONS</text>

  <rect x="40" y="322" width="282" height="150" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="62" cy="348" r="5" fill="#2563eb"/>
  <text x="76" y="353" font-size="15" font-weight="700" fill="#0f172a">plan-gate</text>
  <text x="60" y="378" font-size="12" fill="#334155">per-criterion coverage + verifiability</text>
  <text x="60" y="396" font-size="12" fill="#334155">--tests: criteria vs test suite</text>
  <text x="60" y="414" font-size="12" fill="#334155">--draws 3: self-consistency, /UNSTABLE flags</text>
  <text x="60" y="440" font-size="10.5" fill="#94a3b8" letter-spacing="1">3 DRAWS AFTER THE JAGGEDNESS FINDING</text>

  <rect x="346" y="322" width="282" height="150" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="368" cy="348" r="5" fill="#7c3aed"/>
  <text x="382" y="353" font-size="15" font-weight="700" fill="#0f172a">evidence-gate</text>
  <text x="366" y="378" font-size="12" fill="#334155">== C&lt;i&gt; == tagged evidence blocks</text>
  <text x="366" y="396" font-size="12" fill="#334155">sufficiency + consistency, fail-closed</text>
  <text x="366" y="414" font-size="12" fill="#64748b">missing evidence is never a pass</text>
  <text x="366" y="440" font-size="10.5" fill="#94a3b8" letter-spacing="1">DREX-FIRST ROUTING FOR FULL LOGS</text>

  <rect x="652" y="322" width="282" height="150" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="674" cy="348" r="5" fill="#0d9488"/>
  <text x="688" y="353" font-size="15" font-weight="700" fill="#0f172a">docs-gate</text>
  <text x="672" y="378" font-size="12" fill="#334155">linked-artifact coverage per criterion</text>
  <text x="672" y="396" font-size="12" fill="#334155">staleness: removed lines vs the diff</text>
  <text x="672" y="414" font-size="12" fill="#64748b">drex-first routing · drex,jev override</text>
  <text x="672" y="440" font-size="10.5" fill="#94a3b8" letter-spacing="1">ALL-DOCS DIFFS: DRIFT FORCED OFF IN CODE</text>

  <rect x="958" y="322" width="282" height="150" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="980" cy="348" r="5" fill="#dc2626"/>
  <text x="994" y="353" font-size="15" font-weight="700" fill="#0f172a">arch-gate</text>
  <text x="978" y="378" font-size="12" fill="#334155">plan claims vs TECHNICAL-DOCUMENTATION</text>
  <text x="978" y="396" font-size="12" fill="#334155">documented / conflict / undocumented</text>
  <text x="978" y="414" font-size="12" fill="#64748b">low documented = conventions gap, fail-closed</text>
  <text x="978" y="440" font-size="10.5" fill="#94a3b8" letter-spacing="1">CLAIM TEXTS LOGGED FOR GRADING</text>

  <!-- ── row 3: surfaces, use cases, zcode-gate, calibration ─────────── -->
  <text x="40" y="522" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="1">SURFACES · USE-CASE COVERAGE · AGENT GATE · CALIBRATION</text>

  <rect x="40" y="532" width="282" height="180" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="62" cy="558" r="5" fill="#2563eb"/>
  <text x="76" y="563" font-size="15" font-weight="700" fill="#0f172a">plan-surface + reconcile</text>
  <text x="60" y="588" font-size="12" fill="#334155">criteria → modules · pairwise deps · DAG</text>
  <text x="60" y="606" font-size="12" fill="#334155">uncertain band · cycle breaks · risk flags</text>
  <text x="60" y="624" font-size="12" fill="#334155">jev map layer · dep threshold 0.8</text>
  <text x="60" y="642" font-size="12" fill="#64748b">plan-reconcile grades the surface vs commits</text>
  <text x="60" y="668" font-size="10.5" fill="#94a3b8" letter-spacing="1">DESIGN-TIME: BEFORE THE FS ABSORBS THE WORK</text>

  <rect x="346" y="532" width="282" height="180" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="368" cy="558" r="5" fill="#7c3aed"/>
  <text x="382" y="563" font-size="15" font-weight="700" fill="#0f172a">uc-gate</text>
  <text x="366" y="588" font-size="12" fill="#334155">issues A..X vs existing functionality (FS)</text>
  <text x="366" y="606" font-size="12" fill="#334155">and vs the planned design — 2×2 per issue</text>
  <text x="366" y="624" font-size="12" fill="#64748b">reinvention · already-solved · extension</text>
  <text x="366" y="642" font-size="12" fill="#64748b">genuine-new · residual-gap · true-gap</text>
  <text x="366" y="668" font-size="10.5" fill="#94a3b8" letter-spacing="1">CITATION-FORCED: BAD CITE = NONE</text>

  <rect x="652" y="532" width="282" height="180" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="674" cy="558" r="5" fill="#0d9488"/>
  <text x="688" y="563" font-size="15" font-weight="700" fill="#0f172a">zcode-gate</text>
  <text x="672" y="588" font-size="12" fill="#334155">inert-stripped patterns + safety task</text>
  <text x="672" y="606" font-size="12" fill="#334155">destructive + irreversible → HITL hard-block</text>
  <text x="672" y="624" font-size="12" fill="#64748b">--no-verify = hook_bypass advisory</text>
  <text x="672" y="642" font-size="12" fill="#64748b">clean rows = true-negative calibration</text>
  <text x="672" y="668" font-size="10.5" fill="#94a3b8" letter-spacing="1">QUOTED TEXT CANNOT TRIP THE GATE</text>

  <rect x="958" y="532" width="282" height="180" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="980" cy="558" r="5" fill="#059669"/>
  <text x="994" y="563" font-size="15" font-weight="700" fill="#0f172a">calibration</text>
  <text x="978" y="588" font-size="12" fill="#334155">per-head graded counts · accuracy · span</text>
  <text x="978" y="606" font-size="12" fill="#334155">daily series + early/late trend per head</text>
  <text x="978" y="624" font-size="12" fill="#64748b">jaggedness: unstable draw rate per task</text>
  <text x="978" y="642" font-size="12" fill="#64748b">floors fit only when a head qualifies</text>
  <text x="978" y="668" font-size="10.5" fill="#94a3b8" letter-spacing="1">DISPOSITIONS AUTO-WRITE FEEDBACK ROWS</text>

  <!-- ── bottom banner ────────────────────────────────────────────────── -->
  <rect x="40" y="740" width="1200" height="44" rx="12" fill="#fdf2f8" stroke="#fbcfe8"/>
  <text x="640" y="767" text-anchor="middle" font-size="13" fill="#be185d">every flow appends to the JSONL log · dispositions pair with events as graded rows · the tower surfaces all of it</text>

  <text x="40" y="830" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="1">HITL POLICY — NEGATIVES GATE TRANSITIONS, DISPOSITIONS EARN AUTONOMY</text>

  <rect x="40" y="842" width="282" height="120" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="62" cy="868" r="5" fill="#db2777"/>
  <text x="76" y="873" font-size="15" font-weight="700" fill="#0f172a">disposition</text>
  <text x="60" y="898" font-size="12" fill="#334155">fixed · waived · overridden — reason required</text>
  <text x="60" y="916" font-size="12" fill="#334155">pairs with the matched event automatically</text>
  <text x="60" y="934" font-size="12" fill="#64748b">dispositions + the graded rows calibrate every gate</text>

  <rect x="346" y="842" width="282" height="120" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="368" cy="868" r="5" fill="#0d9488"/>
  <text x="382" y="873" font-size="15" font-weight="700" fill="#0f172a">graded outcomes</text>
  <text x="366" y="898" font-size="12" fill="#334155">calibration: per-head counts · accuracy · trend</text>
  <text x="366" y="916" font-size="12" fill="#334155">floors fit only when a head qualifies (≥20, span)</text>
  <text x="366" y="934" font-size="12" fill="#64748b">0 heads qualify yet — the honest number</text>

  <rect x="652" y="842" width="588" height="120" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="674" cy="868" r="5" fill="#dc2626"/>
  <text x="688" y="873" font-size="15" font-weight="700" fill="#0f172a">zcode-gate HITL hard-block</text>
  <text x="672" y="898" font-size="12" fill="#334155">destructive AND irreversible → block, regardless of advisory_only</text>
  <text x="672" y="916" font-size="12" fill="#334155">high-stakes + unknown reversibility → block (presumed irreversible)</text>
  <text x="672" y="934" font-size="12" fill="#64748b">quoted text cannot trip it — 8 graded false positives fixed 2026-10-02</text>

  <text x="40" y="1010" font-size="12" fill="#94a3b8">plans are contracts · recaps are continuity · every claim is graded — third-brain not required, the tower remembers</text>
</svg>
