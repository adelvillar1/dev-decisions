<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1240" height="780" fill="#f8fafc"/>

  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">v0.2.0 workflows</text>
  <text x="40" y="78" font-size="14" fill="#475569">GitHub layer + agent routing — all advisory by default, every run appended to the JSONL log</text>

  <!-- ── column 1: pr-gate ─────────────────────────────────────────────── -->
  <rect x="40" y="100" width="270" height="520" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="62" cy="130" r="5" fill="#2563eb"/>
  <text x="76" y="135" font-size="16" font-weight="700" fill="#0f172a">pr-gate</text>

  <rect x="60" y="156" width="230" height="54" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="74" y="178" font-size="12.5" font-weight="600" fill="#334155">gh pr diff</text>
  <text x="74" y="196" font-size="11" fill="#94a3b8">branch arg · or current branch</text>
  <line x1="175" y1="210" x2="175" y2="228" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="60" y="232" width="230" height="54" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="74" y="254" font-size="12.5" font-weight="600" fill="#334155">pr_gate task</text>
  <text x="74" y="272" font-size="11" fill="#94a3b8">type · risk · suggested labels</text>
  <line x1="175" y1="286" x2="175" y2="304" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="60" y="308" width="230" height="54" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="74" y="330" font-size="12.5" font-weight="600" fill="#334155">labels</text>
  <text x="74" y="348" font-size="11" fill="#94a3b8">bug · feature · refactor · docs …</text>
  <line x1="175" y1="362" x2="175" y2="380" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="60" y="384" width="230" height="54" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="74" y="406" font-size="12.5" font-weight="600" fill="#1e40af">gh pr edit --add-label</text>
  <text x="74" y="424" font-size="11" fill="#64748b">--dry-run prints only</text>

  <text x="60" y="600" font-size="10.5" fill="#94a3b8" letter-spacing="1">NO TOKENS IN CODE</text>

  <!-- ── column 2: triage-issues ──────────────────────────────────────── -->
  <rect x="340" y="100" width="270" height="520" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="362" cy="130" r="5" fill="#7c3aed"/>
  <text x="376" y="135" font-size="16" font-weight="700" fill="#0f172a">triage-issues</text>

  <rect x="360" y="156" width="230" height="54" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="374" y="178" font-size="12.5" font-weight="600" fill="#334155">gh issue list</text>
  <text x="374" y="196" font-size="11" fill="#94a3b8">--state open · --limit 10</text>
  <line x1="475" y1="210" x2="475" y2="228" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="360" y="232" width="230" height="54" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="374" y="254" font-size="12.5" font-weight="600" fill="#334155">issue_triage task</text>
  <text x="374" y="272" font-size="11" fill="#94a3b8">title + body, batch per issue</text>
  <line x1="475" y1="286" x2="475" y2="304" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="360" y="308" width="230" height="54" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="374" y="330" font-size="12.5" font-weight="600" fill="#334155">kind + priority</text>
  <text x="374" y="348" font-size="11" fill="#94a3b8">bug · feature · docs · question · chore</text>
  <line x1="475" y1="362" x2="475" y2="380" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="360" y="384" width="230" height="54" rx="10" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="374" y="406" font-size="12.5" font-weight="600" fill="#6b21a8">table + gh issue edit</text>
  <text x="374" y="424" font-size="11" fill="#7e22ce">dry-run by default</text>

  <text x="360" y="600" font-size="10.5" fill="#94a3b8" letter-spacing="1">DRY-RUN IS THE DEFAULT</text>

  <!-- ── column 3: changelog ──────────────────────────────────────────── -->
  <rect x="640" y="100" width="270" height="520" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="662" cy="130" r="5" fill="#0d9488"/>
  <text x="676" y="135" font-size="16" font-weight="700" fill="#0f172a">changelog</text>

  <rect x="660" y="156" width="230" height="54" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="674" y="178" font-size="12.5" font-weight="600" fill="#334155">git log --since ref..HEAD</text>
  <text x="674" y="196" font-size="11" fill="#94a3b8">tag or commit · --no-merges</text>
  <line x1="775" y1="210" x2="775" y2="228" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="660" y="232" width="230" height="54" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="674" y="254" font-size="12.5" font-weight="600" fill="#334155">change task per commit</text>
  <text x="674" y="272" font-size="11" fill="#94a3b8">classify each diff_type</text>
  <line x1="775" y1="286" x2="775" y2="304" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="660" y="308" width="230" height="54" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="674" y="330" font-size="12.5" font-weight="600" fill="#334155">group sections</text>
  <text x="674" y="348" font-size="11" fill="#94a3b8">Added · Changed · Fixed · Removed</text>
  <line x1="775" y1="362" x2="775" y2="380" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="660" y="384" width="230" height="54" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="674" y="406" font-size="12.5" font-weight="600" fill="#115e59">Keep-a-Changelog markdown</text>
  <text x="674" y="424" font-size="11" fill="#0f766e">stdout · --write appends CHANGELOG.md</text>

  <text x="660" y="600" font-size="10.5" fill="#94a3b8" letter-spacing="1">UNCLASSIFIED → CHANGED</text>

  <!-- ── column 4: zcode-gate ─────────────────────────────────────────── -->
  <rect x="940" y="100" width="270" height="520" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="962" cy="130" r="5" fill="#dc2626"/>
  <text x="976" y="135" font-size="16" font-weight="700" fill="#0f172a">zcode-gate</text>

  <rect x="960" y="156" width="230" height="54" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="974" y="178" font-size="12.5" font-weight="600" fill="#334155">Bash command JSON</text>
  <text x="974" y="196" font-size="11" fill="#94a3b8">PreToolUse hook · non-Bash exits 0</text>
  <line x1="1075" y1="210" x2="1075" y2="228" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="960" y="232" width="230" height="54" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="974" y="254" font-size="12.5" font-weight="600" fill="#991b1b">destructive regex</text>
  <text x="974" y="272" font-size="11" fill="#b91c1c">push --force · rm -rf · DROP TABLE</text>
  <line x1="1075" y1="286" x2="1075" y2="304" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="960" y="308" width="230" height="54" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="974" y="330" font-size="12.5" font-weight="600" fill="#334155">safety task (local)</text>
  <text x="974" y="348" font-size="11" fill="#94a3b8">destructive? reversible?</text>
  <line x1="1075" y1="362" x2="1075" y2="380" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="960" y="384" width="230" height="54" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="974" y="406" font-size="12.5" font-weight="600" fill="#92400e">warn (1) or block (2)</text>
  <text x="974" y="424" font-size="11" fill="#a16207">[gate] advisory_only = true</text>

  <text x="960" y="600" font-size="10.5" fill="#94a3b8" letter-spacing="1">REGEX IS AUTHORITATIVE</text>

  <!-- bottom banner -->
  <rect x="40" y="700" width="1170" height="44" rx="12" fill="#fdf2f8" stroke="#fbcfe8"/>
  <text x="625" y="727" text-anchor="middle" font-size="13" fill="#be185d">every flow appends one line to the JSONL decision log → confidence curves → calibration loop</text>
</svg>
