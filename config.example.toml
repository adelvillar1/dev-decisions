# dev-decisions config example
# Copy to ~/.config/dev-decisions/config.toml and edit.

[scan]
block_on_secret = true
warn_on_pii = true
max_diff_chars = 12000

[classify]
# Active providers: hosted Fastino (`decide`) and TypeSafe (`jev`).
# `local` is supported by design but not encouraged — offline/private repos.
provider = "decide"          # decide | jev | local | both
block_on_classification = false
confidence_floor = 0.7
escalate_on_null = true
allow_vendor_on_sensitive = false

[providers]
# Hosted Fastino (`decide`) and TypeSafe (`jev`) are the active providers.
# `local` runs the same Decide model offline via sys1 — supported, not encouraged.
decide_api_url = "https://api.fastino.ai/v1/chat/completions"
decide_model = "fastino/GLiNER2.5-Decide"
jev_api_url = "https://api.typesafe.ai/v1/systemone"
jev_model = "jev-1.13.0"
local_venv = "/private/tmp/gliner-decide"
local_model = "fastino/GLiNER2.5-Decide"
# Optional load-once classifier server (recommended; see sys1's
# service/classifier_server.py — one server per model, own port):
# local_server_url = "http://127.0.0.1:8414"
request_timeout_seconds = 30
max_retries = 2
retry_backoff_seconds = 5

# Git hooks don't inherit your shell env — put provider keys in
# ~/.config/dev-decisions/env (one KEY=value per line, chmod 600) and
# install-hooks wires them into every managed hook.
[hooks]
pre_commit = "scan-staged"
pre_push = "classify-diff"

[gate]
advisory_only = true   # true = warn+proceed; false = block
